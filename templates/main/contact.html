{% extends 'base.html' %}
{% load static %}

{% block title %}Contact — Iligan Tourism{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}">
{% endblock %}

{% block content %}

<section class="section">
  <div class="form-card">
    <div class="sec-tag">Get in Touch</div>
    <div class="form-title">Contact <em>Us</em></div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" required placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea name="message" required rows="5" placeholder="Your message..."></textarea>
      </div>
      <button type="submit" class="btn-gold btn-full">Send Message</button>
    </form>
  </div>
</section>

{% endblock %}
