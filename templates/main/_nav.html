{% load static %}
<nav>
    <a href="{% url 'home' %}" class="nav-logo">
        <div class="nav-logo-img">IT</div>
        <span>Iligan <span class="nav-logo-text">Tourism</span></span>
    </a>
    <ul class="nav-links">
        <li><a href="{% url 'attractions' %}">Attractions</a></li>
        <li><a href="{% url 'hotels' %}">Hotels</a></li>
        <li><a href="{% url 'events' %}">Events</a></li>
        <li><a href="{% url 'contact' %}">Contact</a></li>
    </ul>
    <div class="nav-actions">
        {% if user.is_authenticated %}
        <a href="{% url 'my_bookings' %}" class="btn-ghost">My Bookings</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn-gold">Logout</button>
        </form>
        {% else %}
        <a href="{% url 'login' %}" class="btn-ghost">Sign In</a>
        <a href="{% url 'register' %}" class="btn-gold">Register</a>
        {% endif %}
    </div>
</nav>
{% if messages %}
<div class="messages-container">
    {% for m in messages %}
    <div class="alert alert-{{ m.tags }}">{{ m }}</div>
    {% endfor %}
</div>
{% endif %}
