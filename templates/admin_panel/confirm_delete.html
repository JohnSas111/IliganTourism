{% extends 'admin_panel/base.html' %}
{% block title %}Delete {{ object_type }}{% endblock %}
{% block page_title %}Delete {{ object_type }}{% endblock %}
{% block content %}
<div class="admin-form-wrap">
  <div class="admin-form-card">
    <p style="color:rgba(255,255,255,0.7);margin-bottom:1.5rem;">
      Are you sure you want to delete <strong>{{ object_name }}</strong>? This action cannot be undone.
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn-danger">Yes, Delete</button>
        <a href="{{ cancel_url }}" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
